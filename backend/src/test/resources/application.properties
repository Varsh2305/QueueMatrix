server.port=0
spring.application.name=qm-backend-test

# H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:queuematrix_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

qm.jwt.secret=TestQueueMatrixSuperSecure256BitKeyForTestUseRequiresAtLeast32BytesLength!
qm.jwt.expiration-ms=3600000
