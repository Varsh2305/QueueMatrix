server.port=8080
spring.application.name=qm-backend

# MySQL 8.0 Database Configuration
# Override via environment variables: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/queuematrix_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
qm.jwt.secret=${JWT_SECRET:QueueMatrixSuperSecure256BitKeyForProductionUseRequiresAtLeast32BytesLength!}
qm.jwt.expiration-ms=86400000

# Initial QueueMatrix Administrator Configuration (Secure Backend Bootstrap)
qm.admin.bootstrap.enabled=${QM_ADMIN_BOOTSTRAP_ENABLED:true}
qm.admin.bootstrap.name=${QM_ADMIN_NAME:AdminofQM}
qm.admin.bootstrap.email=${QM_ADMIN_EMAIL:adminQM@gmail.com}
qm.admin.bootstrap.phone=${QM_ADMIN_PHONE:+919800000001}
qm.admin.bootstrap.password=${QM_ADMIN_PASSWORD:}
